<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">dc-arista: your request and the data center the Generator creates</title><desc id="desc">When you submit the Create DC form in the service portal, the portal creates a branch and, on it, a TopologyDataCenter, dc-arista in this example, with the strategy ospf-ibgp. It references the DesignTopology PHYSICAL DC ARISTA S, which contains 2 spines, 4 leaf switches, 2 firewalls, 2 OOB switches and 2 console servers. On the branch, the Generator creates these 12 devices and connects each spine to each leaf switch. It creates the building dc-arista with Pod-1, Row-1 and one rack per leaf switch: Rack-1 and Rack-2 each hold a leaf switch, a spine, a console server and an OOB switch, and Rack-3 and Rack-4 each hold a leaf switch. The two firewalls are in the building, not in a rack.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
<rect width="900" height="540" rx="16" fill="white"/>
