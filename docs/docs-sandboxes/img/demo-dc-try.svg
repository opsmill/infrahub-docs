t" font-size="14" font-weight="700" fill="#08738f">VXLAN</text><text x="45" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#264D59">interface Vxlan1</tspan></text><text x="45" y="643" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">&#160;&#160;&#160;vxlan vlan 300 vni 10300</tspan></text><text x="45" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#0B97BB" font-weight="600">&#160;&#160;&#160;vxlan vlan 100 vni 10100</tspan></text><text x="45" y="681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">&#160;&#160;&#160;vxlan vlan 200 vni 10200</tspan></text><text x="470" y="442" text-anchor="start" font-size="14" font-weight="700" fill="#7356C4">Gateway, for l3_gateway or l3_vrf with a prefix</text><rect x="462" y="451" width="380" height="50" rx="6" fill="#EEE9FA" stroke="#7356C4" stroke-width="2" stroke-dasharray="6 5"/><text x="470" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">interface Vlan300</tspan></text><text x="470" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">&#160;&#160;&#160;ip address virtual 172.25.9.1/24</tspan></text><text x="470" y="527" text-anchor="start" font-size="14" font-weight="700" fill="#08738f">BGP EVPN</text><text x="470" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#264D59">router bgp 64512</tspan></text><text x="470" y="567" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">&#160;&#160;&#160;vlan 300</tspan></text><text x="470" y="586" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">&#160;&#160;&#160;&#160;&#160;&#160;rd 10.0.0.3:10300</tspan></text><text x="470" y="605" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#7356C4" font-weight="600">&#160;&#160;&#160;&#160;&#160;&#160;route-target both 10300:10300</tspan></text><text x="470" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#0B97BB" font-weight="600">&#160;&#160;&#160;vlan 100</tspan></text><text x="470" y="643" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#0B97BB" font-weight="600">&#160;&#160;&#160;&#160;&#160;&#160;rd 10.0.0.3:10100</tspan></text><text x="470" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#0B97BB" font-weight="600">&#160;&#160;&#160;&#160;&#160;&#160;route-target both 10100:10100</tspan></text><text x="470" y="681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><tspan fill="#264D59">&#160;&#160;&#160;…</tspan></text></g></svg>
