<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
<title id="title">Network segments: your VPN request and what it changes on the leaf switches</title><desc id="desc">When you submit the Create VPN form in the service portal, the portal creates a branch and, on it, a ServiceNetworkSegment, web-tier in this example, with the VLAN ID 100, the deployment dc-arista and the segment type l2_only, one of the three segment types l2_only, l3_gateway and l3_vrf. The Generator links each segment to Ethernet1 to Ethernet48 on each of the four leaf switches, 192 interfaces. The example has three segments: web-tier with VLAN 100 and the type l2_only, dmz with VLAN 200 and the type l3_gateway, and database with VLAN 300 and the type l3_vrf. In the configuration of each leaf switch, each segment adds its VLAN, the VLAN on the customer ports, a VXLAN mapping of the VLAN to a VNI, here 10100, 10200 and 10300, and a BGP EVPN block with its route distinguisher and route target. A segment of the type l3_gateway or l3_vrf with a prefix also adds a gateway interface on the first address of the prefix: database, with the prefix 172.25.9.0/24, adds the interface Vlan300 with the virtual address 172.25.9.1/24. dmz has no prefix, so it adds no gateway.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
