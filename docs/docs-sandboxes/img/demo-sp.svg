<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="title desc">
<title id="title">Service Provider sandbox: backbone and customer services</title><desc id="desc">An MPLS backbone in AS 65000 of eight PE routers, pe-01 London to pe-08 Zurich. Two customers each have a customer edge router in London and one in Zurich: markets-trading in AS 65100, joined by the L3VPN trading-floor-vpn, and investment-banking in AS 65101, joined by the L3VPN ib-advisory-vpn. An SD-WAN, treasury-branch-sdwan, joins a hub in London to spokes in Frankfurt and Amsterdam.</desc>
